name: Android

on:
  workflow_dispatch:
    inputs:
      formato:
        description: "Formato a compilar"
        required: true
        default: aab
        type: choice
        options: [aab, apk]
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar Flet
        run: pip install flet==1.0.4

      - name: Compilar
        working-directory: movil
        run: flet build ${{ github.event.inputs.formato || 'aab' }} --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: me-paga-android
          path: |
            movil/build/aab/*.aab
            movil/build/apk/*.apk
          if-no-files-found: error
